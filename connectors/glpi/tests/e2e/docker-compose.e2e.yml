# GLPI réel pour le bout-en-bout (voir tests/e2e/README.md).
#   docker compose -f tests/e2e/docker-compose.e2e.yml up -d
# Puis : installer GLPI (assistant web sur http://localhost:8088), activer l'API REST,
# créer un App-Token + un user_token, exporter les GLPI_E2E_* et lancer `pytest tests/e2e`.
services:
  glpi-e2e-db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: glpi
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: glpi
    command: --transaction-isolation=READ-COMMITTED --log-bin --binlog-format=ROW
    volumes:
      - glpi-e2e-db:/var/lib/mysql

  glpi-e2e:
    image: glpi/glpi:10.0.18
    ports:
      - "8088:80"
    environment:
      GLPI_DB_HOST: glpi-e2e-db
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: glpi
    depends_on:
      - glpi-e2e-db
    volumes:
      - glpi-e2e-files:/var/www/html/glpi/files

volumes:
  glpi-e2e-db:
  glpi-e2e-files:
